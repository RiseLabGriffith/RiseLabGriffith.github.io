# Build settings for the RISE Lab website. Content lives in _data/, _projects/ and the page files.
title: RISE Lab
tagline: Responsible, Intelligent and Secure Engineering
description: RISE Lab is a researcher-led cybersecurity lab at Griffith University connecting cyber defence, applied cryptography, privacy-preserving technologies and secure software engineering.
url: "https://riselabgriffith.github.io"
baseurl: ""
lang: en
timezone: Australia/Brisbane
# Square logo used in structured data. The preview image for link shares is set under `defaults` below.
# Both are rendered by scripts/make_social_images.sh (see README, "Search engines and link previews").
logo: /assets/img/logo.png
# Ownership tokens from Google Search Console and Bing Webmaster Tools; uncomment and paste to verify the site.
# webmaster_verifications:
#   google: ""
#   bing: ""
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at
sass:
  style: compressed
  sass_dir: _sass
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/og-image.png
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      seo:
        type: WebPage
  - scope:
      path: "assets"
    values:
      sitemap: false
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs
  - scripts
  - tests
  - .idea
  - "*.docx"
  - node_modules
  - _projects/_template.md

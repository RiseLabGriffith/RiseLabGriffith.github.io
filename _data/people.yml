  dblp: 62/1539-5
  interests: [Adversarial machine learning, AI watermarking, AI security for energy systems, Video LLM safety]
  layers: [I, E]
  bio: >
    Wei Song is an incoming Lecturer in the School of ICT at Griffith University. He completed his PhD at UNSW
    Sydney in 2024 and continued there as a Postdoctoral Research Fellow. His research focuses on AI security,
    particularly adversarial machine learning, AI watermarking and AI security for energy systems, with work at
    USENIX Security, RAID, AAAI, ASE, EMNLP and ACM IMWUT. He leads AUD 3.9M of funded work on secure AI for
    distributed energy assets and co-founded the spinout SunstackAI.


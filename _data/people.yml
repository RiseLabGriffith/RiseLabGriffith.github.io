    orcid: https://orcid.org/0000-0002-5796-7891
  dblp: 24/2058-12
  interests: [Security for AI, Trustworthy graph learning, Machine unlearning, LLM watermarking, Fairness and privacy]
  layers: [R, I, S]
  bio: >
    He Zhang is a Lecturer in the School of ICT at Griffith University, which he joined in February 2026 from RMIT
    University. He obtained his PhD from Monash University. His research spans security for AI and trustworthy AI
    systems: privacy-preserving technologies for AI security, individual trustworthiness aspects such as robustness,
    explainability, privacy and fairness, and the interplay among them. His work appears in ICML, NDSS, WWW, AAAI,
    KDD, ICDE, Proceedings of the IEEE and IEEE TKDE.

- id: yi-liu
  name: Yi Liu
  title: Dr
  role: academic
  position: Lecturer
  photo: yi-liu.jpg

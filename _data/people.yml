  layers: [S]
  bio: >
    Qinyi Li has been a Lecturer in the School of ICT at Griffith University since 2019, following a postdoctoral
    fellowship at Queensland University of Technology, where he also completed his PhD in 2017. His research focuses
    on cryptography and security, with work published at major cryptography venues including CRYPTO and ASIACRYPT.
    He coordinates Griffith's courses in cryptography, network security and cyber security management and is a
    member of the International Association for Cryptologic Research.


<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RISE Lab at Griffith University — official website coming soon.">
  <title>RISE Lab | Griffith University</title>
  <style>
    :root {
      color-scheme: light;
      --griffith-red: #c8102e;
      --ink: #18212b;
      --muted: #65707c;
      --paper: #ffffff;
      --background: #f3f5f7;
      --border: #dce1e6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(200, 16, 46, 0.08), transparent 34rem),
        var(--background);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(40px, 8vw, 72px);
      background: var(--paper);
      border: 1px solid var(--border);
      border-top: 6px solid var(--griffith-red);
      border-radius: 4px;
      box-shadow: 0 18px 50px rgba(24, 33, 43, 0.09);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--griffith-red);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .rule {
      width: 64px;
      height: 3px;
      margin: 30px 0;
      background: var(--griffith-red);
    }

    .message {
      max-width: 34rem;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.65;
    }

    footer {
      margin-top: 42px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Griffith University</p>
    <h1>RISE Lab</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="message">
      Our new website is under development. Please check back soon for updates
      on our research, people, projects, and opportunities.
    </p>
    <footer>&copy; <span id="year"></span> RISE Lab</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>

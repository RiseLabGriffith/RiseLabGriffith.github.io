# Open positions shown on the Join Us page (and counted on the home page). Set open: false or remove an entry when filled.
# Fields: title, kind (phd | postdoc | visiting | honours | masters | intern), supervisors (people ids), layers, summary,
# link (optional), open (true | false).
- title: PhD scholarships in trustworthy AI and applied cryptography
  kind: phd
  supervisors: [leo-zhang]
  layers: [R, I, S]
  summary: Adversarial, backdoor, poisoning and privacy attacks and defences for machine learning, jailbreak and injection attacks on LLMs, and privacy-preserving computation and authentication in emerging settings. Email a CV, transcript and English test result. Competitive applicants usually have a GPA above 80 and first-authored peer-reviewed publications.
  link: https://leozhangcs.github.io/prosStudents/
  open: true
- title: PhD scholarships in LLM and AI agent security
  kind: phd
  supervisors: [yi-liu, leo-zhang]
  layers: [I, E]
  summary: Security of LLM agents, agent skill and tool ecosystems, prompt injection and jailbreak defences, automated penetration testing and software testing with AI. Strong programming skills and an interest in building real systems are essential.
  open: true
- title: PhD scholarships in AI security for energy systems, adversarial ML and AI watermarking
  kind: phd
  supervisors: [wei-song]
  layers: [I, E, R]
  summary: Self-motivated students to help build a research group in adversarial machine learning, AI watermarking and content authenticity, and AI security for distributed energy assets, with links to funded industry projects. Email a CV and transcript.
  open: true
- title: PhD scholarships in cryptography and post-quantum protocols
  kind: phd
  supervisors: [qinyi-li]
  layers: [S]
  summary: Lattice-based cryptography, searchable and functional encryption, anonymous credentials and secure protocols for distributed and AI-enabled systems. A strong mathematics background is expected.

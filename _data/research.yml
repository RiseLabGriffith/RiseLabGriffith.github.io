# The RISE framework: lifecycle stages, four layers and their research topics.
# Layer ids must stay R, I, S, E in this order. Topic ids are referenced from publications.yml (topics: [...]).
# Keep descriptions and summaries to two sentences; the longer rationale lives in the lab proposal.
lifecycle:
  - Risk and Requirements
  - Design and Build
  - Evaluate and Red Team
  - Deploy and Operate
  - Monitor and Improve

layers:
  - id: R
    letter: R
    name: Responsible and Resilient Cybersecurity
    short: Responsible & Resilient
    tagline: Define responsibilities, manage cyber risks, and support prevention, recovery and adaptation.
    keywords: [Governance, Risk controls, Resilience, Accountability, Assurance]
    description: >
      The principles, methods and evidence needed to trust digital and intelligent systems in adversarial
      environments. This layer defines security responsibilities, manages cyber risk and makes sure systems can
      withstand, recover from and adapt to incidents.
    topics:
      - id: robustness-safety-resilience
        name: Robustness, Safety and Resilience
        summary: >
          Threats, malicious inputs, operational failures and cascading risks across software, cloud, critical
          infrastructure and AI-enabled applications, and the defences, resilient architectures and recovery
          strategies that contain them. For learning systems this includes poisoning, adversarial manipulation and
          distribution shift.
        keywords: [Adversarial robustness, Poisoning and backdoors, Resilient architectures, Incident containment, Recovery]
      - id: transparency-accountability
        name: Transparency and Accountability
        summary: >
          Methods that make the security properties and behaviour of systems traceable and auditable: provenance,
          supply-chain transparency, logging, responsibility allocation and human oversight. For AI systems this
          extends to explainability, uncertainty and accountability for automated decisions.
        keywords: [Provenance, Supply-chain transparency, Auditability, Explainability, Human oversight]
      - id: evaluation-verification-assurance
        name: Evaluation, Verification and Continuous Assurance
        summary: >
          Benchmarks, security metrics, testing methodologies, verification techniques and assurance cases that
          check whether systems meet their security, privacy and resilience requirements, and continuous monitoring
          that keeps protections effective as threats, software and models evolve.
        keywords: [Benchmarks, Security metrics, Formal verification, Assurance cases, Regression testing]

  - id: I
    letter: I
    name: Intelligent Cyber Defence and Security Analytics
    short: Intelligent Defence
    tagline: Understand threats, find vulnerabilities and support effective cyber defence with data-driven and automated methods.
    keywords: [Threat intelligence, Security analytics, LLM and agent security, Secure software, Automation]
    description: >
      Intelligent, data-driven and automated methods for understanding threats, finding vulnerabilities and
      defending systems. This layer brings together threat intelligence, security analytics, the security of
      emerging AI systems, and secure software engineering and testing.
    topics:
      - id: threat-intelligence-analytics
        name: Threat Intelligence and Security Analytics
        summary: >
          Collecting, integrating and analysing security evidence from networks, software, identities and cloud
          platforms: threat modelling, malware and attack analysis, vulnerability prioritisation and decision
          support. AI-assisted techniques are adopted where they improve defence and evaluated for reliability
          and robustness.
        keywords: [Threat modelling, Malware analysis, Vulnerability prioritisation, Decision support, AI-assisted defence]
      - id: llm-agent-security
        name: LLM, Foundation-Model and Agent Security
        summary: >
          Threats to large language models, multimodal models and autonomous agents, from jailbreaks, prompt
          injection and poisoning to malicious skills, unsafe tool use and cross-agent attacks. We build automated
          red-teaming, secure architectures, permission models and runtime monitoring for AI systems that touch
          the real world.
        keywords: [Jailbreaks, Prompt injection, Agent skills, Permission control, Runtime monitoring, Red teaming]
      - id: secure-software-engineering
        name: Secure Software Engineering and Testing
        summary: >
          Program analysis, fuzzing, automated test generation, vulnerability detection and supply-chain security
          for conventional software and software with AI components. We also study the security of AI-generated
          code and AI-assisted development, from credential leakage to malicious packages.
        keywords: [Program analysis, Fuzzing, Test generation, Supply-chain security, AI-generated code]

  - id: S
    letter: S
    name: Secure and Privacy-Preserving Foundations
    short: Secure Foundations
    tagline: Protect data, computation and digital interactions with practical cryptography and privacy-enhancing technologies.
    keywords: [Applied cryptography, Differential privacy, Secure computation, Verifiability, Provenance]
    description: >
      The cryptographic and systems foundations that protect sensitive data, computation and digital
      interactions. This layer connects foundational cryptography with practical privacy-enhancing technologies
      for health, finance, government, cyber intelligence, cloud services and AI-enabled systems.
    topics:
      - id: privacy-preserving-data
        name: Privacy-Preserving Data Processing
        summary: >
          Differential privacy, secure aggregation, federated processing, privacy-preserving queries and
          anonymisation, so that data can be used and shared with minimal disclosure. We study inference,
          reconstruction and linkage attacks and balance privacy guarantees against utility and deployability.
        keywords: [Differential privacy, Federated learning, Secure aggregation, Inference attacks, Anonymisation]
      - id: secure-computation
        name: Secure Computation and Collaborative Analytics
        summary: >
          Secure multi-party computation, homomorphic encryption, trusted execution environments and hybrid designs
          that let organisations compute jointly without revealing private inputs, applied to cross-organisational
          threat analysis, health and financial analytics and protected cloud computation.
        keywords: [Multi-party computation, Homomorphic encryption, Trusted execution, Privacy-preserving ML, Collaborative analytics]
      - id: cryptographic-protocols
        name: Cryptographic Protocols for Intelligent Systems
        summary: >
          Protocols for confidentiality, authentication, integrity, access control, key management and provenance
          among users, services, devices and autonomous components, including secure communication, digital
          identity, lattice-based constructions and intellectual-property protection in adversarial environments.
        keywords: [Authentication, Key management, Digital identity, Lattice-based cryptography, IP protection]
      - id: verifiable-computation
        name: Verifiable and Accountable Computation
        summary: >
          Zero-knowledge proofs, verifiable computation, authenticated data structures and auditable protocols that
          let the correctness and provenance of computations be checked without revealing protected information,
          supporting secure outsourcing, supply-chain integrity and accountable automated decisions.
        keywords: [Zero-knowledge proofs, Verifiable computation, Authenticated data structures, Auditable protocols, Accountability]

  - id: E
    letter: E
    name: Engineering, Evaluation and Continuous Operations
    short: Engineering & Operations
    tagline: Turn principles, defences and foundations into deployable systems that stay secure after they leave the lab.
    keywords: [Demonstrators, Toolchains, Red teaming, Monitoring, Continuous assurance]
    description: >
      The integration layer that turns the principles, defences and foundations of R, I and S into deployable
      outcomes: secure engineering practice, integrated toolchains, adversarial evaluation and continuous security
      operations that keep protections effective as software, data and threats change.
    topics:
      - id: cross-layer-demonstrators
        name: Cross-Layer Demonstrators
        summary: >
          Project-supported demonstrators that integrate all four layers: privacy-preserving threat-intelligence
          sharing, secure collaborative analytics, verifiable software and data provenance, resilient
          architectures for critical infrastructure, and secure, auditable AI agents.
        keywords: [Threat-intelligence sharing, Collaborative analytics, Provenance, Critical infrastructure, Auditable agents]
      - id: engineering-toolchains
        name: Engineering Methods and Toolchains
        summary: >
          Practical methods and toolchains for secure development: security by design, automated code and
          dependency analysis, credential protection and supply-chain assurance. Where AI is involved this includes
          secure MLOps, model and data provenance and agent permission controls.
        keywords: [Security by design, Dependency analysis, Secure MLOps, Credential protection, Reproducible evaluation]
      - id: evaluation-red-team
        name: Evaluation and Red-Team Pipelines
        summary: >
          Reusable benchmarks, test harnesses, attack simulations and adversarial evaluation workflows for software,
          networks, cloud infrastructure and AI-enabled applications, combining penetration testing, fuzzing and
          red-team exercises into measurable, reproducible assurance evidence.
        keywords: [Benchmarks, Penetration testing, Attack simulation, Test harnesses, Assurance evidence]
      - id: operational-assurance
        name: Operational Monitoring and Assurance
        summary: >
          Continuous monitoring, threat detection, configuration and dependency analysis, regression testing and
          incident investigation after deployment. For AI systems this includes watching for data or behavioural
          drift, adversarial manipulation and information leakage.
        keywords: [Continuous monitoring, Drift detection, Incident investigation, Regression testing, Post-deployment assurance]

  title: RISE Lab is established at Griffith University
  text: The Responsible, Intelligent and Secure Engineering Lab brings together six academics in the School of ICT, spanning trustworthy AI, applied cryptography, privacy-preserving computation, LLM and agent security and secure software engineering, with a shared R/I/S/E framework and joint supervision of HDR students.

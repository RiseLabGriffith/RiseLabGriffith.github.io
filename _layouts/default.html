<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#0d1b2a">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include header.html %}
  <main id="main-content">
    {% if page.headline %}
    <section class="page-banner"><div class="page-banner-inner"><p class="eyebrow">{{ page.title }}</p><h1>{{ page.headline }}</h1><p>{{ page.intro }}</p></div></section>
    <article class="page-content">{{ content }}</article>
    {% else %}{{ content }}{% endif %}
  </main>
  {% include footer.html %}
  <script>
    const button=document.querySelector('.menu-button'),menu=document.querySelector('.nav-links');
    button.addEventListener('click',()=>{const open=menu.classList.toggle('open');button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');});
  </script>
</body>
</html>

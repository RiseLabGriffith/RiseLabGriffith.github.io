---
layout: default
---
<section class="banner{% if page.banner_class %} {{ page.banner_class }}{% endif %}">
  <div class="container">
    <h1>{{ page.headline | default: page.title }}</h1>
    {% if page.intro %}<p class="lede">{{ page.intro }}</p>{% endif %}
  </div>
</section>
<div class="container page-body{% if page.wide %} page-body--wide{% endif %}">
  {{ content }}
</div>

# Lab members. `id` is the join key used by publications, projects, news and openings.
#
# Fields: id (slug), name, aliases (other spellings used in author lists), title, role, position, photo (file in
# assets/img/people/), email, links {homepage, scholar, griffith, orcid, github, linkedin, dblp}, interests, layers,
# bio, note (small label such as "Incoming 2026"), supervisors (ids), affiliation (visitors/joint), since (year), dblp (PID).
# role: director | academic | student | visitor | joint | alumni

# ---- Director ---------------------------------------------------------------
- id: leo-zhang
  name: Leo Zhang
  aliases: [Leo Yu Zhang]
  title: A/Prof
  role: director
  position: Associate Professor · Lab Director
  photo: leo-zhang.jpg
  email: leo.zhang@griffith.edu.au
  links:
    homepage: https://leozhangcs.github.io/
    scholar: https://scholar.google.com/citations?user=JK21OM0AAAAJ
    griffith: https://experts.griffith.edu.au/41503-leo-zhang
    orcid: https://orcid.org/0000-0001-9330-2662
    linkedin: https://www.linkedin.com/in/leo-yu-zhang-9420997b/
  dblp: 117/3526
  interests: [Trustworthy AI, Applied cryptography, Adversarial and poisoning attacks, Privacy-preserving computation, Authentication]
  layers: [R, I, S]
  bio: >
    Leo Zhang is an Associate Professor at Griffith and directs RISE. He works on trustworthy AI, from
    adversarial, backdoor and privacy attacks to their defences, and on applied cryptography for privacy-preserving computation and authentication. He received the 2021 AISA Researcher of the Year award and is an
    Associate Editor of IEEE TDSC.


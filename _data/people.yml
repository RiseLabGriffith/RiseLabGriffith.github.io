    scholar: https://scholar.google.com/citations?user=DcFodKsAAAAJ
    github: https://github.com/GreyDGL/PentestGPT
  dblp: 97/4626-69
  interests: [LLM security, AI agent security, Software engineering and testing, Automated penetration testing]
  layers: [I, E]
  bio: >
    Yi Liu is an incoming Lecturer in the School of ICT at Griffith University. He received his PhD from Nanyang
    Technological University, Singapore, and was most recently an AI Research Engineer at Quantstamp building an AI
    firewall. His research on LLM security, AI agent security and software testing has appeared at IEEE S&P, ACM
    CCS, USENIX Security, NDSS, ICSE, FSE, ACL, OOPSLA and ASE, and has been cited by the OWASP LLM Top 10, NIST,
    Google DeepMind and OpenAI. He is a core contributor to PentestGPT and has disclosed vulnerabilities in major
    AI coding agents.


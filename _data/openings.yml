- title: PhD scholarships in security for AI and trustworthy AI systems
  kind: phd
  supervisors: [he-zhang]
  layers: [R, I, S]
  summary: Privacy-preserving technologies for AI security, trustworthy graph learning, machine unlearning, LLM watermarking, and the interplay between robustness, explainability, privacy and fairness.

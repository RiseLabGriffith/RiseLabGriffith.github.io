<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social preview card (1200x630). Rendered to assets/img/og-image.png by scripts/make_social_images.sh. -->
  <rect width="1200" height="630" fill="#0b1f3a"/>
  <!-- brand mark -->
  <g transform="translate(80 80) scale(3)">
    <rect width="32" height="32" rx="7" fill="#1a2a44"/>
    <rect x="7" y="7" width="18" height="3" rx="1.5" fill="#7b9bea"/>
    <rect x="7" y="13" width="18" height="3" rx="1.5" fill="#3fbf97"/>
    <rect x="7" y="19" width="18" height="3" rx="1.5" fill="#f0707a"/>
    <rect x="7" y="25" width="18" height="3" rx="1.5" fill="#e09a5c"/>
  </g>
  <text x="80" y="330" font-family="'Source Serif 4', Palatino, Georgia, serif" font-size="128" font-weight="600" fill="#faf9f6">RISE Lab</text>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="400">
    <text x="84" y="392" font-size="32" fill="#c9d3e3">Cybersecurity engineered across the whole</text>
    <text x="84" y="434" font-size="32" fill="#c9d3e3">lifecycle of intelligent systems.</text>
    <text x="84" y="536" font-size="26" fill="#8fa1bb">School of ICT · Griffith University</text>
    <text x="84" y="574" font-size="26" fill="#8fa1bb">riselabgriffith.github.io</text>
  </g>
  <!-- the four layers -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1f3a">
    <rect x="760" y="120" width="360" height="88" rx="14" fill="#7b9bea"/>
    <text x="792" y="176" font-family="'Source Serif 4', Palatino, Georgia, serif" font-size="46">R</text>
    <text x="852" y="174">Responsible</text>
    <rect x="760" y="224" width="360" height="88" rx="14" fill="#3fbf97"/>
    <text x="792" y="280" font-family="'Source Serif 4', Palatino, Georgia, serif" font-size="46">I</text>
    <text x="852" y="278">Intelligent</text>
    <rect x="760" y="328" width="360" height="88" rx="14" fill="#f0707a"/>
    <text x="792" y="384" font-family="'Source Serif 4', Palatino, Georgia, serif" font-size="46">S</text>
    <text x="852" y="382">Secure</text>
    <rect x="760" y="432" width="360" height="88" rx="14" fill="#e09a5c"/>
    <text x="792" y="488" font-family="'Source Serif 4', Palatino, Georgia, serif" font-size="46">E</text>
    <text x="852" y="486">Engineering</text>
  </g>
